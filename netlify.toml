[build]
  base = "frontend"
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "https://constitutional-assistant-api2.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/generate-appeal"
  to = "https://constitutional-assistant-api2.onrender.com/generate-appeal"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://constitutional-assistant-api2.onrender.com/health"
  status = 200
  force = true

[[redirects]]
  from = "/languages"
  to = "https://constitutional-assistant-api2.onrender.com/languages"
  status = 200
  force = true

[[redirects]]
  from = "/supported-formats"
  to = "https://constitutional-assistant-api2.onrender.com/supported-formats"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://constitutional-assistant-api2.onrender.com;"
