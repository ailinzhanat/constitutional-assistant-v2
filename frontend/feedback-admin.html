<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отзывы пользователей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12203A; --panel:#1B2C4F; --paper:#ECEAE3;
    --seal:#B8934A; --seal-bright:#D4AC63; --patina:#3F7D73;
    --text:#E8E6DF; --dim:#9AA6BE; --slate:#4A5164; --slate-dim:#82889A;
    --sans:"IBM Plex Sans",sans-serif; --cond:"IBM Plex Sans Condensed",sans-serif; --mono:"IBM Plex Mono",monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);min-height:100vh;}
  .wrap{max-width:900px;margin:0 auto;padding:32px 24px 70px;}
 
  header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;
    border-bottom:1px solid rgba(232,230,223,0.14);padding-bottom:18px;margin-bottom:20px;}
  h1{font-family:var(--cond);font-weight:700;font-size:21px;margin:0;}
  .count{font-family:var(--mono);font-size:12px;color:var(--dim);}
  .access-badge{font-family:var(--mono);font-size:11px;color:var(--seal-bright);
    background:rgba(184,147,74,0.14);padding:3px 9px;border-radius:10px;}
 
  #gate{max-width:380px;margin:70px auto;text-align:center;}
  .card{background:var(--paper);color:var(--slate);border-radius:2px;padding:28px 26px;}
  .card h2{font-family:var(--cond);font-size:18px;margin:0 0 6px;color:#1A2333;}
  .card p{font-size:13px;color:var(--slate-dim);margin:0 0 18px;}
  input[type=text]{width:100%;font-family:var(--mono);font-size:14px;
    background:#fff;border:1px solid rgba(0,0,0,0.15);color:#1A2333;
    padding:11px 13px;border-radius:2px;margin-bottom:12px;text-align:center;}
  input[type=text]:focus{outline:2px solid var(--seal);outline-offset:1px;}
  .btn{font-family:var(--sans);font-weight:600;font-size:14px;padding:11px 20px;
    border:none;border-radius:2px;background:var(--seal);color:#1A1204;cursor:pointer;}
  .btn:hover{background:var(--seal-bright);}
  .btn:disabled{background:#6b6248;cursor:not-allowed;}
  .err{color:#A6493D;font-size:13px;margin-top:8px;}
 
  #list{display:none;}
  #list.visible{display:block;}
 
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;background:var(--panel);
    padding:14px;border-radius:2px;}
  .filters label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--dim);
    font-family:var(--mono);}
  .filters input, .filters select{font-family:var(--sans);font-size:13px;padding:7px 9px;
    border:1px solid rgba(232,230,223,0.2);border-radius:2px;background:var(--ink);color:var(--text);}
  .filters .btn{align-self:flex-end;padding:8px 16px;font-size:13px;}
  .filters .clear{align-self:flex-end;background:transparent;color:var(--dim);border:1px solid rgba(232,230,223,0.2);
    padding:8px 14px;font-size:13px;border-radius:2px;cursor:pointer;}
 
  .item{background:var(--panel);border-radius:2px;padding:18px 20px;margin-bottom:12px;}
  .meta{font-family:var(--mono);font-size:11px;color:var(--dim);
    display:flex;gap:10px;flex-wrap:wrap;margin-bottom:9px;align-items:center;}
  .lang-chip{padding:1px 7px;border-radius:9px;background:rgba(184,147,74,0.18);color:var(--seal-bright);}
  .role-chip{padding:1px 7px;border-radius:9px;background:rgba(63,125,115,0.22);color:#7FD1C1;}
  .step-chip{padding:1px 7px;border-radius:9px;background:rgba(255,255,255,0.08);color:var(--dim);}
  .msg{font-size:14.5px;line-height:1.6;white-space:pre-wrap;margin:0 0 10px;}
  .contact{margin-top:10px;font-size:12.5px;color:var(--seal-bright);font-family:var(--mono);}
  .empty{color:var(--dim);font-size:14px;text-align:center;padding:50px 0;}
 
  .tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .sentiment{font-size:11px;padding:2px 8px;border-radius:9px;font-family:var(--mono);}
  .sentiment.positive{background:rgba(63,125,115,0.25);color:#7FD1C1;}
  .sentiment.neutral{background:rgba(255,255,255,0.08);color:var(--dim);}
  .sentiment.negative{background:rgba(166,73,61,0.22);color:#E39A90;}
  .category-select{font-family:var(--sans);font-size:12px;padding:3px 6px;border-radius:9px;
    background:rgba(184,147,74,0.14);color:var(--seal-bright);border:1px solid rgba(184,147,74,0.3);}
  .category-select:disabled{opacity:0.6;cursor:not-allowed;}
  .auto-note{font-size:10.5px;color:var(--dim);font-style:italic;}
  .save-status{font-size:11px;margin-left:4px;}
  .save-status.ok{color:#7FD1C1;}
  .save-status.error{color:#E39A90;}
</style>
</head>
<body>
<div class="wrap">
 
  <div id="gate">
    <div class="card">
      <h2>Отзывы пользователей</h2>
      <p>Введите код администратора (полный доступ или только просмотр).</p>
      <input type="text" id="code" placeholder="Код администратора" autocomplete="off">
      <button class="btn" id="btnEnter" style="width:100%;">Открыть</button>
      <div class="err" id="gateErr"></div>
    </div>
  </div>
 
  <div id="list">
    <header>
      <h1>Отзывы пользователей</h1>
      <div style="display:flex;gap:8px;align-items:center;">
        <span class="access-badge" id="accessBadge"></span>
        <span class="count" id="count"></span>
      </div>
    </header>
 
    <div class="filters">
      <label>Дата с
        <input type="date" id="fDateFrom">
      </label>
      <label>Дата по
        <input type="date" id="fDateTo">
      </label>
      <label>Шаг интерфейса
        <select id="fStep">
          <option value="">Все шаги</option>
          <option value="01_consent">01 Согласие</option>
          <option value="02_description">02 Описание проблемы</option>
          <option value="03_jurisdiction">03 Проверка юрисдикции</option>
          <option value="04_draft">04 Черновик обращения</option>
        </select>
      </label>
      <label>Роль автора
        <select id="fRole">
          <option value="">Любая</option>
          <option value="citizen">Гражданин</option>
          <option value="lawyer">Юрист</option>
        </select>
      </label>
      <button class="btn" id="btnFilter">Применить</button>
      <button class="clear" id="btnClearFilter" type="button">Сбросить</button>
    </div>
 
    <div id="items"></div>
  </div>
 
</div>
 
<script>
// Backend задеплоен на Render.
const API_BASE = "";
let adminCode = "";
let accessLevel = "view"; // "full" | "view" — определяется по первому успешному запросу
 
const STEP_LABELS = {
  "01_consent": "01 Согласие",
  "02_description": "02 Описание",
  "03_jurisdiction": "03 Юрисдикция",
  "04_draft": "04 Черновик",
};
const ROLE_LABELS = { citizen: "Гражданин", lawyer: "Юрист" };
const SENTIMENT_LABELS = { "позитив": "позитив", "нейтрально": "нейтрально", "негатив": "негатив" };
const SENTIMENT_CLASS = { "позитив": "positive", "нейтрально": "neutral", "негатив": "negative" };
const FEEDBACK_CATEGORIES = [
  "непонятная формулировка",
  "ошибка распознавания текста",
  "неверное определение юрисдикции",
  "техническая ошибка",
  "предложение",
  "другое",
];
 
document.getElementById("btnEnter").addEventListener("click", () => load(true));
document.getElementById("code").addEventListener("keydown", e => { if(e.key==="Enter") load(true); });
document.getElementById("btnFilter").addEventListener("click", () => load(false));
document.getElementById("btnClearFilter").addEventListener("click", () => {
  document.getElementById("fDateFrom").value = "";
  document.getElementById("fDateTo").value = "";
  document.getElementById("fStep").value = "";
  document.getElementById("fRole").value = "";
  load(false);
});
 
function buildQuery(){
  const params = new URLSearchParams();
  const dFrom = document.getElementById("fDateFrom").value;
  const dTo = document.getElementById("fDateTo").value;
  const step = document.getElementById("fStep").value;
  const role = document.getElementById("fRole").value;
  // Дата хранится как ISO timestamp — берём начало/конец суток
  if (dFrom) params.set("date_from", dFrom + "T00:00:00");
  if (dTo) params.set("date_to", dTo + "T23:59:59");
  if (step) params.set("step", step);
  if (role) params.set("role", role);
  return params.toString();
}
 
async function load(isLogin){
  const errEl = document.getElementById("gateErr");
  errEl.textContent = "";
 
  if (isLogin) {
    const code = document.getElementById("code").value.trim();
    if(!code){ errEl.textContent = "Введите код"; return; }
    adminCode = code;
  }
 
  try{
    const qs = buildQuery();
    const res = await fetch(`${API_BASE}/api/feedback${qs ? "?" + qs : ""}`, { headers:{ "X-Admin-Code": adminCode } });
    if(res.status === 401){ errEl.textContent = "Неверный код"; return; }
    if(!res.ok){ errEl.textContent = "Ошибка запроса"; return; }
 
    const data = await res.json();
    document.getElementById("gate").style.display = "none";
    document.getElementById("list").classList.add("visible");
    document.getElementById("count").textContent = `показано: ${data.filtered_count ?? data.items.length} · всего: ${data.count}`;
 
    // Пробуем определить уровень доступа: пробуем PATCH-подобный запрос не делаем,
    // просто пытаемся дёрнуть дашборд аналитики (там access_level возвращается явно).
    detectAccessLevel();
 
    renderItems(data.items || []);
  }catch(err){
    errEl.textContent = "Не удалось подключиться к серверу. Проверьте, что backend запущен.";
  }
}
 
async function detectAccessLevel(){
  try{
    const res = await fetch(`${API_BASE}/api/analytics/dashboard?period_days=1`, { headers:{ "X-Admin-Code": adminCode } });
    if (res.ok) {
      const d = await res.json();
      accessLevel = d.access_level || "view";
    }
  }catch(e){ /* не критично — по умолчанию считаем "view" и просто не даём редактировать */ }
  document.getElementById("accessBadge").textContent = accessLevel === "full" ? "полный доступ" : "только просмотр";
  document.querySelectorAll(".category-select").forEach(sel => { sel.disabled = accessLevel !== "full"; });
}
 
function renderItems(items){
  const box = document.getElementById("items");
  if(!items.length){
    box.innerHTML = `<p class="empty">Отзывов не найдено по заданным фильтрам.</p>`;
    return;
  }
  box.innerHTML = items.map(it => {
    const sentiment = it.sentiment || "нейтрально";
    const sentClass = SENTIMENT_CLASS[sentiment] || "neutral";
    const categoryOptions = FEEDBACK_CATEGORIES.map(c =>
      `<option value="${esc(c)}" ${c === it.category ? "selected" : ""}>${esc(c)}</option>`
    ).join("");
    return `
      <div class="item" data-id="${esc(it.feedback_id)}">
        <div class="meta">
          <span>${fmtDate(it.created_at)}</span>
          <span class="lang-chip">${esc(it.language || "")}</span>
          ${it.step ? `<span class="step-chip">${esc(STEP_LABELS[it.step] || it.step)}</span>` : ""}
          ${it.role ? `<span class="role-chip">${esc(ROLE_LABELS[it.role] || it.role)}</span>` : ""}
          ${it.page ? `<span>${esc(it.page)}</span>` : ""}
        </div>
        <p class="msg">${esc(it.message || "")}</p>
        <div class="tags">
          <select class="category-select" ${accessLevel !== "full" ? "disabled" : ""}>${categoryOptions}</select>
          <span class="sentiment ${sentClass}">${esc(SENTIMENT_LABELS[sentiment] || sentiment)}</span>
          ${it.auto_categorized && !it.category_edited_by_moderator ? '<span class="auto-note">автокатегория ИИ — подсказка, требует проверки</span>' : ""}
          ${it.category_edited_by_moderator ? '<span class="auto-note">категория проверена модератором</span>' : ""}
          <span class="save-status" data-role="save-status"></span>
        </div>
        ${it.contact ? `<div class="contact">${esc(it.contact)}</div>` : ""}
      </div>
    `;
  }).join("");
 
  box.querySelectorAll(".item").forEach(el => {
    const select = el.querySelector(".category-select");
    select.addEventListener("change", () => saveCategory(el.dataset.id, select.value, el));
  });
}
 
async function saveCategory(feedbackId, category, itemEl){
  const statusEl = itemEl.querySelector('[data-role="save-status"]');
  statusEl.textContent = "сохраняю…";
  statusEl.className = "save-status";
  try{
    const res = await fetch(`${API_BASE}/api/feedback/${encodeURIComponent(feedbackId)}/category`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json", "X-Admin-Code": adminCode },
      body: JSON.stringify({ category })
    });
    if(!res.ok){ throw new Error(); }
    statusEl.textContent = "сохранено";
    statusEl.className = "save-status ok";
    setTimeout(() => { statusEl.textContent = ""; }, 2000);
  }catch(e){
    statusEl.textContent = "ошибка сохранения (нужен полный код доступа)";
    statusEl.className = "save-status error";
  }
}
 
function fmtDate(iso){
  if(!iso) return "—";
  try{
    const d = new Date(iso);
    return d.toLocaleString("ru-RU", {day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  }catch(e){ return iso; }
}
 
function esc(s){
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
