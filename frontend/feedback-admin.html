<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отзывы пользователей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12203A; --panel:#1B2C4F; --paper:#ECEAE3;
    --seal:#B8934A; --seal-bright:#D4AC63; --patina:#3F7D73;
    --text:#E8E6DF; --dim:#9AA6BE; --slate:#4A5164; --slate-dim:#82889A;
    --sans:"IBM Plex Sans",sans-serif; --cond:"IBM Plex Sans Condensed",sans-serif; --mono:"IBM Plex Mono",monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);min-height:100vh;}
  .wrap{max-width:820px;margin:0 auto;padding:32px 24px 70px;}

  header{display:flex;align-items:baseline;justify-content:space-between;
    border-bottom:1px solid rgba(232,230,223,0.14);padding-bottom:18px;margin-bottom:28px;}
  h1{font-family:var(--cond);font-weight:700;font-size:21px;margin:0;}
  .count{font-family:var(--mono);font-size:12px;color:var(--dim);}

  #gate{max-width:380px;margin:70px auto;text-align:center;}
  .card{background:var(--paper);color:var(--slate);border-radius:2px;padding:28px 26px;}
  .card h2{font-family:var(--cond);font-size:18px;margin:0 0 6px;color:#1A2333;}
  .card p{font-size:13px;color:var(--slate-dim);margin:0 0 18px;}
  input[type=text]{width:100%;font-family:var(--mono);font-size:14px;
    background:#fff;border:1px solid rgba(0,0,0,0.15);color:#1A2333;
    padding:11px 13px;border-radius:2px;margin-bottom:12px;text-align:center;}
  input[type=text]:focus{outline:2px solid var(--seal);outline-offset:1px;}
  .btn{font-family:var(--sans);font-weight:600;font-size:14px;padding:11px 20px;
    border:none;border-radius:2px;background:var(--seal);color:#1A1204;cursor:pointer;}
  .btn:hover{background:var(--seal-bright);}
  .err{color:#A6493D;font-size:13px;margin-top:8px;}

  #list{display:none;}
  #list.visible{display:block;}
  .item{background:var(--panel);border-radius:2px;padding:18px 20px;margin-bottom:12px;}
  .meta{font-family:var(--mono);font-size:11px;color:var(--dim);
    display:flex;gap:12px;flex-wrap:wrap;margin-bottom:9px;}
  .msg{font-size:14.5px;line-height:1.6;white-space:pre-wrap;margin:0;}
  .contact{margin-top:10px;font-size:12.5px;color:var(--seal-bright);font-family:var(--mono);}
  .empty{color:var(--dim);font-size:14px;text-align:center;padding:50px 0;}
  .lang-chip{padding:1px 7px;border-radius:9px;background:rgba(184,147,74,0.18);color:var(--seal-bright);}
</style>
</head>
<body>
<div class="wrap">

  <div id="gate">
    <div class="card">
      <h2>Отзывы пользователей</h2>
      <p>Введите код администратора для просмотра.</p>
      <input type="text" id="code" placeholder="Код администратора" autocomplete="off">
      <button class="btn" id="btnEnter" style="width:100%;">Открыть</button>
      <div class="err" id="gateErr"></div>
    </div>
  </div>

  <div id="list">
    <header>
      <h1>Отзывы пользователей</h1>
      <span class="count" id="count"></span>
    </header>
    <div id="items"></div>
  </div>

</div>

<script>
// ⚠️ ПОСЛЕ ДЕПЛОЯ НА RENDER: замените строку ниже на реальный адрес backend,
// например "https://constitutional-assistant-api.onrender.com"
// Для локальной разработки оставьте как есть.
const API_BASE = "http://127.0.0.1:8000";

document.getElementById("btnEnter").addEventListener("click", load);
document.getElementById("code").addEventListener("keydown", e => { if(e.key==="Enter") load(); });

async function load(){
  const code = document.getElementById("code").value.trim();
  const errEl = document.getElementById("gateErr");
  errEl.textContent = "";
  if(!code){ errEl.textContent = "Введите код"; return; }

  try{
    const res = await fetch(`${API_BASE}/api/feedback`, { headers:{ "X-Admin-Code": code } });
    if(res.status === 401){ errEl.textContent = "Неверный код"; return; }
    if(!res.ok){ errEl.textContent = "Ошибка запроса"; return; }

    const data = await res.json();
    document.getElementById("gate").style.display = "none";
    document.getElementById("list").classList.add("visible");
    document.getElementById("count").textContent = `всего: ${data.count}`;

    const box = document.getElementById("items");
    if(!data.items || data.items.length === 0){
      box.innerHTML = `<p class="empty">Пока нет ни одного отзыва.</p>`;
      return;
    }
    box.innerHTML = data.items.map(it => `
      <div class="item">
        <div class="meta">
          <span>${fmtDate(it.created_at)}</span>
          <span class="lang-chip">${esc(it.language || "")}</span>
          ${it.page ? `<span>${esc(it.page)}</span>` : ""}
        </div>
        <p class="msg">${esc(it.message || "")}</p>
        ${it.contact ? `<div class="contact">${esc(it.contact)}</div>` : ""}
      </div>
    `).join("");
  }catch(err){
    errEl.textContent = "Не удалось подключиться к серверу. Проверьте, что backend запущен.";
  }
}

function fmtDate(iso){
  if(!iso) return "—";
  try{
    const d = new Date(iso);
    return d.toLocaleString("ru-RU", {day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  }catch(e){ return iso; }
}

function esc(s){
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
